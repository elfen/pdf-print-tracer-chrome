<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="PDF Print Tracer">
  <title>PDF Print Tracer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2b5e"/>
      <stop offset="1" stop-color="#0f7c8a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- fond -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- page avec coin plié -->
  <g filter="url(#sh)">
    <path d="M30 14 H70 L96 40 V84 a4 4 0 0 1 -4 4 H34 a4 4 0 0 1 -4 -4 Z" fill="#ffffff"/>
  </g>
  <path d="M70 14 V36 a4 4 0 0 0 4 4 H96 Z" fill="#c9d3e6"/>

  <!-- « PDF » tracé en lettres géométriques (pas de police nécessaire) -->
  <g fill="none" stroke="#d32f2f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.5 0)">
    <path d="M39 76 V52 H45 a6 6 0 0 1 0 12 H39"/>
    <path d="M56 52 H60 a12 12 0 0 1 0 24 H56 Z"/>
    <path d="M77 76 V52 H90 M77 64 H88"/>
  </g>

  <!-- pipeline : étapes franchies (vert) jusqu'à l'étape qui bloque (rouge) -->
  <path d="M26 106 H102" stroke="#ffffff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  <circle cx="26" cy="106" r="7" fill="#34d399" stroke="#ffffff" stroke-width="3"/>
  <circle cx="51" cy="106" r="7" fill="#34d399" stroke="#ffffff" stroke-width="3"/>
  <circle cx="77" cy="106" r="7" fill="#34d399" stroke="#ffffff" stroke-width="3"/>
  <circle cx="102" cy="106" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
</svg>
